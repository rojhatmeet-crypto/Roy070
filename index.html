<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roy070</title>

  <!-- App mode (standalone) op iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roy070">
  <meta name="theme-color" content="#111827">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <style>
    :root {
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #111827 0%, #1e3a8a 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      min-height: 100dvh;
      /* ruimte voor de notch / home-indicator in app mode */
      padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
    }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p.sub { color: #cbd5e1; margin-bottom: 28px; }
    .badge {
      display: none;
      background: #16a34a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
    }
    .install {
      display: none;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 16px;
      padding: 20px;
      max-width: 420px;
      text-align: left;
      line-height: 1.6;
    }
    .install h2 { font-size: 1.05rem; margin-bottom: 10px; }
    .install ol { padding-left: 20px; }
    .install li { margin-bottom: 6px; }
    .icon-share {
      display: inline-block;
      transform: translateY(2px);
    }
    body.standalone .badge { display: inline-block; }
    body:not(.standalone) .install { display: block; }
  </style>
</head>
<body>
  <img class="logo" src="icons/icon-192.png" alt="Roy070 logo">
  <h1>Roy070</h1>
  <p class="sub">Welkom bij Roy070</p>

  <span class="badge">✓ App mode actief</span>

  <div class="install">
    <h2>📲 Installeer als app op je iPhone</h2>
    <ol>
      <li>Open deze site in <strong>Safari</strong></li>
      <li>Tik op de <strong>Deel-knop</strong> <span class="icon-share">⎋</span> onderaan</li>
      <li>Kies <strong>"Zet op beginscherm"</strong></li>
      <li>Tik op <strong>"Voeg toe"</strong></li>
    </ol>
    <p>Daarna opent Roy070 fullscreen als app, zonder Safari-balken.</p>
  </div>

  <script>
    // Detecteer of de site als app (standalone) is geopend
    const standalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches;
    if (standalone) document.body.classList.add("standalone");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
