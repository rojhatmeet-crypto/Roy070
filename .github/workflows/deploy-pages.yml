name: Deploy naar GitHub Pages

on:
  push:
    branches:
      - main
      - claude/iphone-app-mode-site-yifpud
      - claude/elektra-laagspanning-website-ku0axk

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
