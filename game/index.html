<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Volt ⚡</title>
  <meta name="description" content="Volt — tik, zap en scheer langs de weerstanden. Hoe ver kom jij?">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Volt">
  <meta name="theme-color" content="#12081f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0514;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #wrap {
      height: 100%;
      display: flex;
      justify-content: center;
    }
    canvas { display: block; height: 100%; }
    #mute {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      right: 12px;
      z-index: 5;
      font-size: 22px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div id="mute">🔊</div>

<script>
(() => {
  "use strict";

  // ---------- canvas ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.min(window.innerWidth, 520);
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // ---------- geluid (WebAudio, geen bestanden nodig) ----------
  let audio = null;
  let muted = localStorage.getItem("volt-muted") === "1";
  const muteBtn = document.getElementById("mute");
  muteBtn.textContent = muted ? "🔇" : "🔊";

  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted || !audio) return;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audio.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, audio.currentTime + dur);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dur);
  }
  const sFlap  = () => tone(340, 0.09, "square", 0.06, 620);
  const sScore = () => { tone(660, 0.09, "triangle", 0.1); setTimeout(() => tone(880, 0.12, "triangle", 0.1), 70); };
  const sPick  = () => { tone(880, 0.07, "triangle", 0.1); setTimeout(() => tone(1175, 0.07, "triangle", 0.1), 55); setTimeout(() => tone(1568, 0.1, "triangle", 0.1), 110); };
  const sCrash = () => { tone(220, 0.35, "sawtooth", 0.14, 55); tone(180, 0.3, "square", 0.08, 45); };

  muteBtn.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    muted = !muted;
    localStorage.setItem("volt-muted", muted ? "1" : "0");
    muteBtn.textContent = muted ? "🔇" : "🔊";
  });

  // ---------- state ----------
  const MENU = 0, PLAY = 1, DEAD = 2;
  let state = MENU;
  let paused = false;

  let px, py, vy, angle;          // speler (het vonkje)
  let pillars = [];               // {x, gapY, gapH, passed, bolt:{y,taken}|null}
  let particles = [];
  let popups = [];                // {text, x, y, t}
  let score = 0;
  let best = +(localStorage.getItem("volt-best") || 0);
  let newRecord = false;
  let deadAt = 0;
  let shake = 0, flash = 0;
  let tGlobal = 0;

  // fysica relatief aan schermhoogte, zodat het overal hetzelfde speelt
  const GRAV = () => 3.5 * H;
  const FLAP = () => -0.97 * H;
  const MAXFALL = () => 1.5 * H;
  const R = () => Math.max(11, 0.019 * H);      // straal vonkje
  const PW = () => 0.165 * W;                   // pilaarbreedte
  const SPACING = () => 0.68 * W;
  const GROUND = () => H - Math.max(34, 0.055 * H);
  const speed = () => Math.min(0.5 * W + score * 0.004 * W, 0.68 * W);
  const gapH = () => Math.max(0.215 * H, 0.30 * H - score * 0.0022 * H);

  // ---------- achtergrond: circuitbaan (één keer genereren) ----------
  const traces = [];
  (function genTraces() {
    for (let i = 0; i < 14; i++) {
      const pts = [];
      let x = Math.random() * 1000, y = Math.random();
      pts.push([x, y]);
      for (let s = 0; s < 5; s++) {
        x += 40 + Math.random() * 140;
        if (Math.random() < 0.5) y = Math.min(0.95, Math.max(0.05, y + (Math.random() - 0.5) * 0.3));
        pts.push([x, y]);
      }
      traces.push(pts);
    }
  })();
  let bgScroll = 0;

  function reset() {
    px = 0.30 * W;
    py = 0.45 * H;
    vy = 0;
    angle = 0;
    pillars = [];
    particles = [];
    popups = [];
    score = 0;
    newRecord = false;
    shake = 0;
    flash = 0;
    let x = W * 1.3;
    let lastGap = 0.45 * H;
    for (let i = 0; i < 4; i++) {
      lastGap = nextGapY(lastGap);
      pillars.push(makePillar(x, lastGap));
      x += SPACING();
    }
  }

  function nextGapY(prev) {
    const lo = 0.16 * H + gapH() / 2;
    const hi = GROUND() - 0.10 * H - gapH() / 2;
    // niet te grote sprong t.o.v. de vorige opening, dat speelt oneerlijk
    const maxJump = 0.30 * H;
    const min = Math.max(lo, prev - maxJump);
    const max = Math.min(hi, prev + maxJump);
    return min + Math.random() * (max - min);
  }

  function makePillar(x, gy) {
    return {
      x, gapY: gy, gapH: gapH(), passed: false,
      bolt: Math.random() < 0.35 ? { taken: false } : null
    };
  }

  // ---------- input ----------
  function tap() {
    ensureAudio();
    if (state === MENU) {
      reset();
      state = PLAY;
      flap();
    } else if (state === PLAY) {
      if (paused) { paused = false; return; }
      flap();
    } else if (state === DEAD) {
      if (performance.now() - deadAt > 450) {
        reset();
        state = PLAY;
        flap();
      }
    }
  }
  function flap() {
    vy = FLAP();
    sFlap();
    for (let i = 0; i < 3; i++) spawnParticle(px - R(), py + R() * 0.6, 1);
  }
  window.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(); });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); tap(); }
  });
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === PLAY) paused = true;
  });

  // ---------- particles ----------
  function spawnParticle(x, y, kind) {
    // kind 0=staart 1=flap 2=crash 3=pickup
    const a = Math.random() * Math.PI * 2;
    const sp = kind === 2 ? 60 + Math.random() * 320 : kind === 3 ? 40 + Math.random() * 160 : 10 + Math.random() * 50;
    particles.push({
      x, y,
      vx: kind === 0 ? -speed() * 0.4 : Math.cos(a) * sp,
      vy: kind === 0 ? (Math.random() - 0.5) * 40 : Math.sin(a) * sp,
      life: 1,
      decay: kind === 2 ? 1.4 : 2.6,
      size: kind === 2 ? 2 + Math.random() * 3.5 : 1.5 + Math.random() * 2,
      hue: kind === 3 ? 280 : 40 + Math.random() * 15
    });
  }

  function die() {
    state = DEAD;
    deadAt = performance.now();
    shake = 14;
    flash = 1;
    sCrash();
    for (let i = 0; i < 34; i++) spawnParticle(px, py, 2);
    if (score > best) {
      best = score;
      newRecord = true;
      localStorage.setItem("volt-best", best);
    }
  }

  // ---------- update ----------
  function update(dt) {
    tGlobal += dt;
    if (flash > 0) flash = Math.max(0, flash - dt * 3);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= p.decay * dt;
    }
    particles = particles.filter((p) => p.life > 0);
    for (const q of popups) q.t += dt;
    popups = popups.filter((q) => q.t < 0.8);

    if (state === MENU) {
      bgScroll += speed() * 0.2 * dt;
      return;
    }
    if (state === PLAY && paused) return;

    if (state === PLAY) bgScroll += speed() * 0.2 * dt;

    // speler
    vy = Math.min(vy + GRAV() * dt, MAXFALL());
    py += vy * dt;
    const target = vy < 0 ? -0.42 : Math.min(1.25, vy / MAXFALL() * 1.7);
    angle += (target - angle) * Math.min(1, dt * 9);
    if (py < R()) { py = R(); vy = Math.max(vy, 0); }

    if (state === DEAD) {
      if (py > H + 60) py = H + 60;
      return;
    }

    // staartje
    if (Math.random() < 0.9) spawnParticle(px - R() * 0.8, py, 0);

    // pilaren
    for (const p of pillars) p.x -= speed() * dt;
    if (pillars[0].x + PW() < -20) {
      pillars.shift();
      const last = pillars[pillars.length - 1];
      pillars.push(makePillar(last.x + SPACING(), nextGapY(last.gapY)));
    }

    const hitR = R() * 0.78; // vergevingsgezinde hitbox
    for (const p of pillars) {
      // score bij passeren
      if (!p.passed && p.x + PW() < px) {
        p.passed = true;
        score++;
        sScore();
        popups.push({ text: "+1", x: px, y: py - 30, t: 0 });
      }
      // bliksem oppakken
      if (p.bolt && !p.bolt.taken) {
        const bx = p.x + PW() / 2, by = p.gapY;
        const d = Math.hypot(px - bx, py - by);
        if (d < hitR + 13) {
          p.bolt.taken = true;
          score += 2;
          sPick();
          popups.push({ text: "+2 ⚡", x: bx, y: by - 24, t: 0 });
          for (let i = 0; i < 12; i++) spawnParticle(bx, by, 3);
        }
      }
      // botsing
      if (px + hitR > p.x && px - hitR < p.x + PW()) {
        const top = p.gapY - p.gapH / 2, bot = p.gapY + p.gapH / 2;
        if (py - hitR < top || py + hitR > bot) { die(); return; }
      }
    }

    // grond
    if (py + hitR > GROUND()) { die(); return; }
  }

  // ---------- draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBolt(x, y, s, fill) {
    ctx.beginPath();
    const B = [[0.58,0.10],[0.30,0.54],[0.46,0.54],[0.40,0.90],[0.72,0.44],[0.54,0.44],[0.64,0.10]];
    B.forEach(([bx, by], i) => {
      const X = x + (bx - 0.5) * s, Y = y + (by - 0.5) * s;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    });
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function draw() {
    // achtergrond
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#12081f");
    g.addColorStop(1, "#2a1247");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // circuit-sporen (parallax)
    ctx.save();
    ctx.strokeStyle = "rgba(167, 139, 250, 0.10)";
    ctx.lineWidth = 2;
    for (const tr of traces) {
      ctx.beginPath();
      tr.forEach(([tx, ty], i) => {
        const X = (((tx - bgScroll) % 1100) + 1100) % 1100 - 50;
        const Y = ty * H;
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      });
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // pilaren (weerstanden)
    for (const p of pillars) {
      const top = p.gapY - p.gapH / 2, bot = p.gapY + p.gapH / 2;
      drawPillar(p.x, -8, PW(), top + 8, true);
      drawPillar(p.x, bot, PW(), GROUND() - bot + 8, false);
      if (p.bolt && !p.bolt.taken) {
        const bob = Math.sin(tGlobal * 5 + p.x) * 5;
        ctx.save();
        ctx.shadowColor = "#ffd60a";
        ctx.shadowBlur = 16;
        drawBolt(p.x + PW() / 2, p.gapY + bob, 30, "#ffd60a");
        ctx.restore();
      }
    }

    // grond: printplaat
    ctx.fillStyle = "#1d0f33";
    ctx.fillRect(0, GROUND(), W, H - GROUND());
    ctx.strokeStyle = "rgba(255, 214, 10, 0.25)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND() + 1);
    ctx.lineTo(W, GROUND() + 1);
    ctx.stroke();
    ctx.fillStyle = "rgba(167, 139, 250, 0.25)";
    const dotGap = 46;
    for (let x = -(bgScroll * 2 % dotGap); x < W; x += dotGap) {
      ctx.fillRect(x, GROUND() + 10, 16, 3);
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = `hsl(${p.hue}, 100%, 62%)`;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // speler: gloeiend vonkje
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle * 0.5);
    ctx.shadowColor = "#ffd60a";
    ctx.shadowBlur = 22;
    const pg = ctx.createRadialGradient(0, 0, 1, 0, 0, R());
    pg.addColorStop(0, "#fffbe6");
    pg.addColorStop(0.55, "#ffd60a");
    pg.addColorStop(1, "#ff9500");
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(0, 0, R(), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    drawBolt(0, 0, R() * 1.15, "#7c2d12");
    ctx.restore();

    // score-popups
    for (const q of popups) {
      ctx.globalAlpha = 1 - q.t / 0.8;
      ctx.fillStyle = "#ffd60a";
      ctx.font = "bold 22px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(q.text, q.x, q.y - q.t * 55);
      ctx.globalAlpha = 1;
    }

    ctx.restore(); // einde schermschudden

    // HUD / schermen
    ctx.textAlign = "center";
    const safeTop = 60;

    if (state === PLAY && !paused) {
      ctx.save();
      ctx.shadowColor = "#ffd60a";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#fff";
      ctx.font = "800 52px -apple-system, sans-serif";
      ctx.fillText(score, W / 2, safeTop + 40);
      ctx.restore();
    }

    if (state === PLAY && paused) {
      overlay();
      ctx.fillStyle = "#fff";
      ctx.font = "700 26px -apple-system, sans-serif";
      ctx.fillText("Gepauzeerd", W / 2, H * 0.45);
      ctx.font = "16px -apple-system, sans-serif";
      ctx.fillStyle = "#c4b5fd";
      ctx.fillText("Tik om verder te gaan", W / 2, H * 0.45 + 34);
    }

    if (state === MENU) {
      const bob = Math.sin(tGlobal * 2.2) * 8;
      ctx.save();
      ctx.shadowColor = "#ffd60a";
      ctx.shadowBlur = 26;
      ctx.fillStyle = "#ffd60a";
      ctx.font = "900 64px -apple-system, sans-serif";
      ctx.fillText("VOLT", W / 2, H * 0.30 + bob);
      ctx.restore();
      drawBolt(W / 2 + 92, H * 0.30 + bob - 22, 44, "#ffd60a");
      ctx.fillStyle = "#e9d5ff";
      ctx.font = "17px -apple-system, sans-serif";
      ctx.fillText("Tik om te zappen, ontwijk de weerstanden", W / 2, H * 0.30 + 44 + bob);
      ctx.fillStyle = "#fff";
      ctx.font = "700 22px -apple-system, sans-serif";
      ctx.fillText("👆 Tik om te spelen", W / 2, H * 0.55);
      if (best > 0) {
        ctx.fillStyle = "#c4b5fd";
        ctx.font = "16px -apple-system, sans-serif";
        ctx.fillText("Record: " + best, W / 2, H * 0.55 + 32);
      }
    }

    if (state === DEAD && performance.now() - deadAt > 350) {
      overlay();
      ctx.fillStyle = "#fff";
      ctx.font = "800 34px -apple-system, sans-serif";
      ctx.fillText("⚡ Kortsluiting!", W / 2, H * 0.34);
      ctx.font = "900 58px -apple-system, sans-serif";
      ctx.fillStyle = "#ffd60a";
      ctx.fillText(score, W / 2, H * 0.34 + 70);
      ctx.font = "17px -apple-system, sans-serif";
      ctx.fillStyle = newRecord ? "#4ade80" : "#c4b5fd";
      ctx.fillText(newRecord ? "🏆 Nieuw record!" : "Record: " + best, W / 2, H * 0.34 + 106);
      ctx.fillStyle = "#fff";
      ctx.font = "700 20px -apple-system, sans-serif";
      ctx.fillText("Tik om opnieuw te spelen", W / 2, H * 0.62);
    }

    // witte flits bij crash
    if (flash > 0) {
      ctx.globalAlpha = flash * 0.5;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function overlay() {
    ctx.fillStyle = "rgba(10, 5, 20, 0.62)";
    ctx.fillRect(0, 0, W, H);
  }

  function drawPillar(x, y, w, h, isTop) {
    ctx.save();
    // donkere behuizing
    ctx.fillStyle = "#241242";
    roundRect(x, y, w, h, 7);
    ctx.fill();
    // neon rand aan de kant van de opening
    ctx.strokeStyle = "rgba(255, 214, 10, 0.85)";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#ffd60a";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    if (isTop) { ctx.moveTo(x + 4, y + h); ctx.lineTo(x + w - 4, y + h); }
    else { ctx.moveTo(x + 4, y); ctx.lineTo(x + w - 4, y); }
    ctx.stroke();
    ctx.shadowBlur = 0;
    // weerstand-streepjes
    ctx.fillStyle = "rgba(167, 139, 250, 0.35)";
    const start = isTop ? y + h - 26 : y + 12;
    for (let i = 0; i < 3; i++) {
      const sy = isTop ? start - i * 18 : start + i * 18;
      if (sy > y + 4 && sy + 6 < y + h - 4) ctx.fillRect(x + 8, sy, w - 16, 6);
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.032);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);

  // offline via de service worker van de hoofdsite
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("../sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
